name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ['1.15', '1.16', '1.17']
        otp: ['26', '27']
        exclude:
          - elixir: '1.15'
            otp: '27'
        include:
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{matrix.elixir}}
        otp-version: ${{matrix.otp}}

    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Check formatting
      run: mix format --check-formatted

    - name: Compile with warnings as errors
      run: mix compile --warnings-as-errors

    - name: Run unit tests
      run: mix test --exclude integration

    - name: Run integration tests
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: mix test --only integration
      continue-on-error: true

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28'

    # _build includes the Dialyzer PLTs (plt_core_path: "_build/plts").
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-quality-1.19-28-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-quality-1.19-28-

    - name: Install dependencies
      run: mix deps.get

    - name: Check unused dependencies
      run: mix deps.unlock --check-unused

    - name: Check for retired dependencies
      run: mix hex.audit

    - name: Credo
      run: mix credo --strict

    - name: Dialyzer
      run: mix dialyzer --format github

    - name: Docs build without warnings
      run: mix docs --warnings-as-errors

  # Consumers ignore our mix.lock: test against the newest versions our requirements allow.
  unlocked-deps:
    name: Test with unlocked dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28'

    - name: Unlock and fetch latest dependencies
      run: |
        mix deps.unlock --all
        mix deps.get

    - name: Compile with warnings as errors
      run: mix compile --warnings-as-errors

    - name: Run unit tests
      run: mix test --exclude integration

  # Runs the OpenTelemetry handler from guides/telemetry.md against stubbed calls.
  otel-guide:
    name: OTel guide handler
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28'

    - name: Check the OTel guide handler
      run: elixir scripts/check_otel_guide.exs
